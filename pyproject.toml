[project]
name = "chat-with-docs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "doclayout-yolo>=0.0.4",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.0.0",
    "langchain-core>=1.6.0",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp<2",
    "pdfplumber>=0.11.10",
    "psycopg[binary,pool]>=3.3.4",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=5.7.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
